name: triagem

# Os pedidos não ficam aqui. Cada issue nova vira uma issue no repositório
# privado onde o acesso é concedido, e a daqui é esvaziada, fechada e
# trancada. O nome do repositório de destino fica num segredo, para não
# aparecer nos logs, que são públicos.
#
# Qualquer pessoa dispara este workflow. Por isso o texto da issue só é lido
# no script, nunca num run:, e o token do App sai só com permissão de issues.
# Quem decide se o pedido vale é o repositório de destino, que confere a
# iniciativa contra a configuração da org.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  encaminhar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Token do App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_CHAVE_PRIVADA }}
          owner: ${{ github.repository_owner }}
          repositories: voluntariado,${{ secrets.REPOSITORIO_DESTINO }}
          permission-issues: write

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DESTINO: ${{ secrets.REPOSITORIO_DESTINO }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const issue = context.payload.issue;
            const corpo = issue.body || '';
            const campo = (titulo) => {
              const m = corpo.match(new RegExp(`### ${titulo}\\s+([\\s\\S]*?)(?=\\n### |$)`));
              return m ? m[1].trim() : '';
            };
            const iniciativa = (campo('Iniciativa').match(/^[a-z0-9-]+/) || [''])[0];
            const ajuda = campo('Como você pode ajudar\\? \\(opcional\\)');

            // O usuário vem do autor da issue, não do texto.
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: process.env.DESTINO,
              title: `Acesso de voluntário: ${issue.user.login}`,
              body: [
                '### Iniciativa', '', iniciativa || '(não informada)', '',
                '### Usuário', '', issue.user.login, '',
                '### Como pode ajudar', '', ajuda && ajuda !== '_No response_' ? ajuda : '(não informado)',
              ].join('\n'),
            });

            const alvo = { ...context.repo, issue_number: issue.number };
            await github.rest.issues.update({ ...alvo,
              title: 'Pedido de acesso recebido',
              body: 'Pedido recebido e encaminhado ao núcleo da iniciativa.',
              state: 'closed', state_reason: 'completed' });
            await github.rest.issues.lock({ ...alvo, lock_reason: 'resolved' });
