name: triagem

# Os pedidos não ficam aqui. Cada issue nova (pedido de acesso de voluntário,
# de entrada no núcleo ou de repositório novo) vira uma issue no repositório
# privado onde o pedido é atendido, e a daqui recebe o link dela e é
# esvaziada, fechada e trancada.
# Quem não consegue abrir o link o repassa a quem pode aprovar.
#
# O link mostra o nome do repositório de destino, que é privado. O nome
# continua num segredo para não ficar no código.
#
# Qualquer pessoa dispara este workflow. Por isso o texto da issue só é lido
# no script, nunca num run:, e o token do App sai só com permissão de issues.
# Quem decide se o pedido vale é o repositório de destino, que confere tudo
# contra a configuração da org.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  encaminhar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Token do App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_CHAVE_PRIVADA }}
          owner: ${{ github.repository_owner }}
          repositories: voluntariado,${{ secrets.REPOSITORIO_DESTINO }}
          permission-issues: write

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DESTINO: ${{ secrets.REPOSITORIO_DESTINO }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const issue = context.payload.issue;
            const corpo = issue.body || '';
            const campo = (titulo) => {
              const t = titulo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const m = corpo.match(new RegExp(`### ${t}\\s+([\\s\\S]*?)(?=\\n### |$)`));
              const valor = m ? m[1].trim() : '';
              return valor === '_No response_' ? '' : valor;
            };
            const slug = (texto) => (texto.toLowerCase().match(/^[a-z0-9-]+/) || [''])[0];
            // Uma linha só, para o texto livre não conseguir abrir um "###".
            const linha = (texto) => texto.replace(/\s+/g, ' ').trim();
            const secao = (titulo, valor) => [`### ${titulo}`, '', valor, ''];

            // Quem pede vem do autor da issue, não do texto. Só o pedido de
            // núcleo traz um username digitado, porque se pode pedir por outra
            // pessoa. Os campos livres vão por último, para não conseguirem se
            // passar pelos de cima, e o formulário se reconhece pelo primeiro
            // campo, que vem antes de qualquer texto livre.
            let pedido;
            if (corpo.startsWith('### Usuário do GitHub')) {
              // O username é digitado, então só vale inteiro: um pedaço dele
              // poderia ser a conta de outra pessoa.
              const digitado = campo('Usuário do GitHub').replace(/^@/, '');
              const usuario = /^[A-Za-z0-9-]+$/.test(digitado) ? digitado : '';
              const iniciativa = slug(campo('Frente'));
              pedido = {
                titulo: `Núcleo (acesso de escrita, verificar): ${usuario || '(sem usuário)'} na ${iniciativa || '(sem frente)'}`,
                aprova: 'um admin da org',
                corpo: [
                  ...secao('Iniciativa', iniciativa || '(não informada)'),
                  ...secao('Usuário', usuario || '(não informado)'),
                  ...secao('Pedido por', issue.user.login),
                  ...secao('Motivo', campo('Por que no núcleo? (opcional)') || '(não informado)'),
                ],
              };
            } else if (corpo.startsWith('### Nome do repositório')) {
              const escolhida = slug(campo('Iniciativa'));
              const nova = escolhida === 'nova';
              const iniciativa = nova ? slug(campo('Nome da iniciativa nova')) : escolhida;
              const repositorio = slug(campo('Nome do repositório'));
              pedido = {
                titulo: `Novo repositório: ${repositorio || '(sem nome)'}`,
                aprova: 'um admin da org',
                corpo: [
                  ...secao('Repositório', repositorio || '(não informado)'),
                  ...secao('Iniciativa', iniciativa || '(não informada)'),
                  ...secao('Criar iniciativa', nova ? 'sim' : 'não'),
                  ...secao('Visibilidade', slug(campo('Visibilidade')) || 'private'),
                  ...secao('Pedido por', issue.user.login),
                  ...secao('Descrição do repositório', linha(campo('Para que serve')) || '(não informada)'),
                  ...secao('Descrição da iniciativa', nova ? linha(campo('Descrição da iniciativa nova')) || '(não informada)' : '(já existe)'),
                  ...secao('Contexto', campo('Contexto (opcional)') || '(não informado)'),
                ],
              };
            } else {
              pedido = {
                titulo: `Acesso de voluntário: ${issue.user.login}`,
                aprova: 'alguém do núcleo da iniciativa',
                corpo: [
                  ...secao('Iniciativa', slug(campo('Iniciativa')) || '(não informada)'),
                  ...secao('Usuário', issue.user.login),
                  ...secao('Como pode ajudar', campo('Como você pode ajudar? (opcional)') || '(não informado)'),
                ],
              };
            }

            const { data: criada } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: process.env.DESTINO,
              title: pedido.titulo,
              body: pedido.corpo.join('\n').trim(),
            });

            const alvo = { ...context.repo, issue_number: issue.number };
            await github.rest.issues.createComment({ ...alvo, body: [
              `Pedido encaminhado: ${criada.html_url}`,
              '',
              `Esse link só abre para os núcleos e os admins da org. Se você não consegue abrir, é normal: copie e mande para ${pedido.aprova}, que pode aprovar.`,
            ].join('\n') });
            await github.rest.issues.update({ ...alvo,
              title: 'Pedido recebido',
              body: 'Pedido recebido e encaminhado. O link está no comentário abaixo.',
              state: 'closed', state_reason: 'completed' });
            await github.rest.issues.lock({ ...alvo, lock_reason: 'resolved' });
